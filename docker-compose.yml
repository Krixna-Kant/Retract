services:
  falkordb:
    image: falkordb/falkordb:latest
    container_name: retract-falkordb
    ports:
      - "6379:6379"   # Redis protocol / FalkorDB
      - "3000:3000"   # FalkorDB Browser UI
    volumes:
      - falkordb_data:/var/lib/falkordb/data
    restart: unless-stopped

  # Full stack in containers: `docker compose up --build`, then open http://localhost:8000
  app:
    build: .
    container_name: retract-app
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      FALKORDB_HOST: falkordb
      FALKORDB_PORT: "6379"
    depends_on:
      - falkordb

volumes:
  falkordb_data:
